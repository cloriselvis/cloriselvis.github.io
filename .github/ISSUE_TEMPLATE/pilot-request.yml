name: "Pilot request: LeadLint CSV cleanup"
description: "Request a lightweight CSV cleanup review (sanitized sample only)."
title: "Pilot request: LeadLint CSV cleanup"
labels:
  - pilot
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing LeadLint Studio.

        **Privacy rule:** Please do **not** post private customer/contact data here.
        Share only a **sanitized sample** (5-10 rows with fake emails / redacted domains) or describe the file.
  - type: input
    id: role
    attributes:
      label: Role / team
      placeholder: "SalesOps at 10-person SaaS, recruiter, agency, ..."
    validations:
      required: true
  - type: input
    id: import_target
    attributes:
      label: Import target (CRM / spreadsheet)
      placeholder: "HubSpot, Salesforce, Pipedrive, Airtable, Google Sheets, ..."
    validations:
      required: true
  - type: input
    id: row_count
    attributes:
      label: Approximate row count
      placeholder: "e.g. 250, 1200, 1800"
    validations:
      required: true
  - type: textarea
    id: mess
    attributes:
      label: What's messy about the file?
      description: "Duplicates, invalid emails, phone formats, domain inconsistencies, missing names, etc."
      placeholder: "e.g. lots of duplicates from merged event lists; phone formats inconsistent; emails invalid..."
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Optional LeadLint summary (recommended)
      description: "In the app: click Clean list, then Copy summary, and paste it here. No raw rows are included."
      render: markdown
    validations:
      required: false
  - type: textarea
    id: sample
    attributes:
      label: Optional sanitized sample (5-10 rows)
      description: "Paste a sanitized snippet with fake emails / redacted domains. No real customer data."
      render: csv
    validations:
      required: false
  - type: textarea
    id: expectations
    attributes:
      label: What would a helpful output look like?
      placeholder: "Clean CSV + issue report + import notes; anything else?"
    validations:
      required: false
